 }).sort((a,b)=>String(b.published_at).localeCompare(String(a.published_at)))

const agentConnection={status:null,checked:false,error:false,polling:false};
function statusText(k){return (STATUS_LABELS[state.lang]||STATUS_LABELS.en)[k]||STATUS_LABELS.en[k]||k}
function nextUtcScan(now){let t=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),9,23,0);if(t<=now.getTime())t+=86400000;return t}
function statusView(now=new Date()){
 if(location.protocol==='file:')return {kind:'offline',tone:'neutral'};
 if(agentConnection.error)return {kind:'unavailable',tone:'error'};
 if(!agentConnection.checked)return {kind:'checking',tone:'neutral'};
 const s=agentConnection.status;
 if(!s||s.format!=='HOV-STATUS-1'||s.state==='not_configured')return {kind:'setup',tone:'warn'};
 const ago=value=>{let parsed=Date.parse(value||'');return Number.isFinite(parsed)?now.getTime()-parsed:Infinity};
 if(s.state==='running'){
  let elapsed=ago(s.started_at);
  if(elapsed>=0&&elapsed<20*60000)return {kind:'running',tone:'live'};
  return {kind:'stale',tone:'warn'};
 }
 if(s.state==='failed')return {kind:'failed',tone:'error'};
 if(s.state==='complete'){
  let elapsed=ago(s.last_run_at);
  if(elapsed<0||elapsed>48*3600000||!Number(s.sources_scanned))return {kind:'stale',tone:'warn'};
  return Number(s.errors)>0?{kind:'partial',tone:'warn'}:{kind:'active',tone:'live'};
 }
 return {kind:'setup',tone:'warn'};
}
async function loadAgentStatus(){
 if(location.protocol==='file:'||agentConnection.polling)return;
 agentConnection.polling=true;
 try{
  let r=await fetch('./agent/data/agent_status.json?nocache='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  let obj=await r.json();if(!obj||obj.format!=='HOV-STATUS-1'||typeof obj.state!=='string')throw Error('Invalid agent status');
  agentConnection.status=obj;agentConnection.error=false;
 }catch(_){agentConnection.status=null;agentConnection.error=true}
 finally{agentConnection.checked=true;agentConnection.polling=false;updateAgentClock()}
}

function clockText(k){return (CLOCK_LABELS[state.lang]||CLOCK_LABELS.en)[k]}
function updateAgentClock(){
 const display=document.getElementById('agentClockTime');if(!display){refreshDiscoverySignal();return;}
 const now=new Date(),locale=({en:'en-US',fr:'fr-CA',es:'es-ES',pt:'pt-BR',de:'de-DE',ar:'ar'})[state.lang]||'en-CA';
 try{
  display.textContent=new Intl.DateTimeFormat(state.lang==='en'?'en-US':'en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:state.lang==='en'}).format(now);
  document.getElementById('agentClockDate').textContent=new Intl.DateTimeFormat(locale,{weekday:'short',month:'short',day:'numeric',year:'numeric'}).format(now);
  let tz=Intl.DateTimeFormat(locale,{timeZoneName:'short'}).formatToParts(now).find(v=>v.type==='timeZoneName')?.value;
  document.getElementById('agentClockZone').textContent=tz||Intl.DateTimeFormat().resolvedOptions().timeZone||'';
 }catch(_){display.textContent=now.toLocaleTimeString();}
 const until=Math.max(0,Math.floor((nextUtcScan(now)-now.getTime())/1000));
 const secs=until%60,mins=Math.floor(until/60)%60,hrs=Math.floor(until/3600);
 const ticker=document.getElementById('agentCountdown');if(ticker){ticker.textContent=[hrs,mins,secs].map(n=>String(n).padStart(2,'0')).join(':');ticker.setAttribute('datetime','PT'+hrs+'H'+mins+'M'+secs+'S')}
 const label=document.getElementById('agentCountdownLabel');if(label)label.textContent=statusText('count');
 const note=document.getElementById('agentCountdownNote');if(note)note.textContent=statusText('countNote');
 const health=document.getElementById('agentStatusChip'),statusNote=document.getElementById('agentStatusNote');
 if(health){let status=statusView(now);health.className='agenthealthstatus '+(status.tone==='neutral'?'':status.tone);health.textContent=statusText(status.kind);if(statusNote){let line=statusText(status.kind+'Note');let st=agentConnection.status;if(st?.last_run_at){let when=new Date(st.last_run_at);if(!Number.isNaN(when.getTime()))line+=' · '+statusText('last')+': '+when.toLocaleString(locale);}statusNote.textContent=line}}
}

function parseAgentReport(obj){if(!obj||obj.format!=='HOV-AGENT-1'||!Array.isArray(obj.candidates)||obj.candidates.length>800)throw Error(powerText('reportInvalid'));let valid=[];for(let c of obj.candidates){if(!c||typeof c.title!=='string'||typeof c.url!=='string')continue;if(c.kind==='directory_candidate'||c.opportunity_type==='official_directory_lead')continue;let url=cleanURL(c.url);if(!url||c.title.length>250)continue;let id=String(c.id||c.url).slice(0,160);valid.push({id,title:c.title.slice(0,250),url,provider:String(c.provider||'').slice(0,120),source:String(c.source||'').slice(0,120),country:String(c.country||'Worldwide').slice(0,80),kind:String(c.kind||'new_item').slice(0,50),opportunity_type:String(c.opportunity_type||'').slice(0,100),priority:String(c.priority||'specialist').slice(0,20),award:String(c.award||'').slice(0,120),deadline:String(c.deadline||'').slice(0,20),event_end:String(c.event_end||'').slice(0,20),summary:String(c.summary||'').slice(0,600),found_at:String(c.found_at||'').slice(0,40)})}return {format:'HOV-AGENT-1',generated_at:String(obj.generated_at||'').slice(0,50),sources_scanned:Number(obj.sources_scanned)||0,sources_configured:Number(obj.sources_configured)||0,sources_limited:Number(obj.sources_limited)||0,source_changes:Number(obj.source_changes)||0,consumer_candidates:Number(obj.consumer_candidates)||0,specialist_candidates:Number(obj.specialist_candidates)||0,failures:Array.isArray(obj.failures)?obj.failures.slice(0,80).map(x=>String(x).slice(0,240)):[],source_health:Array.isArray(obj.source_health)?obj.source_health.slice(0,120).filter(x=>x&&typeof x.name==='string').map(x=>({name:x.name.slice(0,130),url:cleanURL(x.url)||'',status:String(x.status||'unknown').slice(0,30),detail:String(x.detail||'').slice(0,200)})):[],candidates:valid}}

isting':listingForm(id);break;case 'lead':leadForm();break;case 'approveLead':{let i=+id,l=state.leads[i];if(l)listingForm(null,l);break}case 'dropLead':if(confirm('Remove this lead?')){state.leads.splice(+id,1);persist();render()}break;case 'removeListing':if(confirm('Remove listing from this local catalogue?')){state.removed.push(id);state.saved=state.saved.filter(v=>v!==id);delete state.tracks[id];persist();render()}break;case 'exportJSON':backup();closeModal();break;case 'exportCSV':csv();closeModal();break;case 'importJSON':document.querySelector('#importFile').click();break;case 'print':window.print();break;case 'clearData':if(confirm('Erase all local saved listings, applications, edits and profile? This cannot be undone unless you exported a backup.')){localStorage.removeItem(STORE);state=structuredClone(defaults);render();notify(tr('updated'))}break;default:break}});
document.addEventListener('submit',e=>{let f=e.target;let formId=f.getAttribute('id');if(!['trackForm','matchForm','listingForm','leadForm'].includes(formId))return;e.preventDefault();let o=new FormData(f);if(formId==='trackForm'){let id=o.get('id');state.tracks[id]={status:o.get('status'),due:o.get('due'),notes:String(o.get('notes')||'').slice(0,2500)};persist();closeModal();render();notify(tr('updated'))}else if(formId==='matchForm'){state.profile={country:document.querySelector('#profileCountry').value,role:document.querySelector('#profileRole').value,interests:[...document.querySelectorAll('[name="interests"]:checked')].map(n=>n.value)};persist();render();notify(tr('updated'))}else if(formId==='leadForm'){let title=String(o.get('title')||'').trim(),url=cleanURL(o.get('url'));if(!title||!url)return alert('Valid title and HTTP(S) source link required.');state.leads.push({title,url,note:String(o.get('note')||'').slice(0,700),submitted:new Date().toISOString().slice(0,10)});persist();closeModal();render();notify(tr('submitted'))}else if(formId==='listingForm'){
 let id=String(o.get('id')||''),cats=o.getAll('cats'),url=cleanURL(o.get('url')),title=String(o.get('title')||'').trim();
 if(!title||!url||!cats.length)return alert('Please enter a name, an official source URL, and at least one department.');
 let provider=String(o.get('provider')||'').trim(),what=String(o.get('what')||'').trim(),status=String(o.get('status')||'reference'),review_status=String(o.get('review_status')||'pending'),verified_source=o.get('verified_source')==='yes';

 const today=new Date().toISOString().slice(0,10),deadline=String(o.get('deadline')||'');
 if(review_status==='verified'||status==='program'||status==='invite'){
   if(review_status!=='verified'||!verified_source||provider.length<2||what.length<20||eligibility_details.length<15||terms.length<15||application_steps.length<10||!reviewed||reviewed>today){
     return alert('Publication requires: verified editorial decision; a checked official source; provider; exact benefit (20+ characters); detailed eligibility (15+); terms (15+); application instructions (10+); and a valid review date. You can choose Pending verification and Draft to save without publishing.');
   }
   if(status==='program'&&deadline&&deadline<today)return alert(ew('future'));
 }
 if(['program','invite'].includes(status)&&!url.startsWith('https://'))return alert('Public listing sources must use secure HTTPS URLs.');
 if(review_status==='rejected'&&(['program','invite'].includes(status)||verified_source))return alert('Rejected listings must remain a draft or closed, with source verification unchecked.');
 let old=id?getRec(id):null;
 let rec={...(old||{}),id:id||'local_'+Date.now(),title,url,cats,provider,what,verified_source,review_status,
 country:String(o.get('country')||'Worldwide'),type:String(o.get('type')||'other'),rarity:Math.min(100,Math.max(1,Number(o.get('rarity'))||75)),

 persist();closeModal();render();notify('Listing saved locally. Public publication requires GitHub JSON upload.');

async function initVisitorCounter(){
 if(location.hostname!=='cristrini06-cpu.github.io')return;
 const endpoint='https://abacus.jasoncameron.dev';
 const namespace='hov-global-cfc96caa7ab4';const key='homepage-visits';
 let hit=false;
 try{if(sessionStorage.getItem('hov_counted_session')!=='1'){sessionStorage.setItem('hov_counted_session','1');hit=true}}catch(e){hit=true}
 const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),4500);
 try{
  let resp=await fetch(endpoint+'/'+(hit?'hit':'get')+'/'+namespace+'/'+key,{mode:'cors',cache:'no-store',signal:ctrl.signal,referrerPolicy:'no-referrer'});
  if(!resp.ok)throw new Error('Counter unavailable');let data=await resp.json();
  if(Number.isSafeInteger(data.value)&&data.value>=0){visibleVisitCount=data.value;paintVisitorCount()}
  else throw new Error('Invalid counter value');
 }catch(err){if(hit){try{sessionStorage.removeItem('hov_counted_session')}catch(e){}}}
 finally{clearTimeout(timeout)}
}
